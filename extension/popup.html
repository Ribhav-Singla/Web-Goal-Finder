<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 360px; margin: 0; padding: 12px; font: 13px/1.4 system-ui, sans-serif; color: #1f2328; background: #fff; }
      textarea { width: 100%; box-sizing: border-box; height: 72px; padding: 8px; font: inherit; resize: vertical;
        border: 1px solid #c9ced6; border-radius: 6px; }
      .row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
      button { font: inherit; padding: 6px 12px; border: 1px solid #c9ced6; border-radius: 6px; background: #f4f5f7; cursor: pointer; }
      button.primary { background: #1d5fa8; border-color: #1d5fa8; color: #fff; }
      button:disabled { opacity: 0.5; cursor: default; }
      #save { margin-left: auto; }
      #status { margin-top: 10px; font-weight: 600; }
      #status.error, #status.blocked { color: #c0352b; }
      #status.done { color: #1d7a3a; }
      ol { margin: 6px 0 0; padding-left: 22px; max-height: 260px; overflow: auto; }
      li { margin-bottom: 6px; }
      .op { font-weight: 600; }
      .muted { color: #667085; }
      .bad { color: #c0352b; }
    </style>
  </head>
  <body>
    <textarea id="goal" placeholder="What should be done on this page?"></textarea>
    <div class="row">
      <button id="run" class="primary">Run</button>
      <button id="stop" disabled>Stop</button>
      <button id="save" title="Save the page state and screenshots to Downloads/web-snap (Alt+Shift+S)">Save snapshot</button>
    </div>
    <div id="status"></div>
    <ol id="steps"></ol>
    <script src="popup.js"></script>
  </body>
</html>
